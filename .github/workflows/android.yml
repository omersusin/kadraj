name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        env:
          KADRAJ_KEYSTORE: ${{ runner.temp }}/kadraj.p12
          KADRAJ_STORE_PASSWORD: ${{ secrets.KADRAJ_STORE_PASSWORD }}
          KADRAJ_KEY_ALIAS: ${{ secrets.KADRAJ_KEY_ALIAS }}
          KADRAJ_KEY_PASSWORD: ${{ secrets.KADRAJ_KEY_PASSWORD }}
          KADRAJ_STORE_TYPE: PKCS12
          KADRAJ_KEYSTORE_BASE64: ${{ secrets.KADRAJ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KADRAJ_KEYSTORE_BASE64" ]; then
            printf '%s' "$KADRAJ_KEYSTORE_BASE64" | base64 -d > "$KADRAJ_KEYSTORE"
          fi
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify release APK
        run: |
          SIGNED=$(find app/build/outputs/apk/release -name 'app-release.apk' | head -1)
          if [ -z "$SIGNED" ]; then
            echo "No signed APK (signing secrets not configured)."
            exit 0
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c 4 "$SIGNED"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kadraj-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNED=$(find app/build/outputs/apk/release -name 'app-release.apk' | head -1)
          if [ -z "$SIGNED" ]; then
            echo "Refusing to publish an unsigned release."
            exit 1
          fi
          cp "$SIGNED" "kadraj-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "kadraj-${GITHUB_REF_NAME}.apk" \
            --title "Kadraj $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
