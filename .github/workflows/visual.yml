name: Visual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture start screen
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.omersusin.kadraj.debug/com.omersusin.kadraj.MainActivity
            sleep 15
            adb exec-out screencap -p > home.png
            adb shell am force-stop com.omersusin.kadraj.debug
            adb shell am start -W -n com.omersusin.kadraj.debug/com.omersusin.kadraj.MainActivity --ez demoProject true
            sleep 15
            adb exec-out screencap -p > editor.png
            adb shell am force-stop com.omersusin.kadraj.debug
            adb shell am start -W -n com.omersusin.kadraj.debug/com.omersusin.kadraj.MainActivity --ez demoProject true --es demoTab Style
            sleep 12
            adb exec-out screencap -p > style.png
            adb shell am force-stop com.omersusin.kadraj.debug
            adb shell am start -W -n com.omersusin.kadraj.debug/com.omersusin.kadraj.MainActivity --ez demoProject true --es demoTab Photo
            sleep 12
            adb exec-out screencap -p > photo.png
            adb shell am force-stop com.omersusin.kadraj.debug
            adb shell am start -W -n com.omersusin.kadraj.debug/com.omersusin.kadraj.MainActivity --ez demoProject true --es demoTab Text
            sleep 12
            adb exec-out screencap -p > text.png
            adb shell dumpsys activity activities > activity.txt || true
            adb logcat -d -t 400 > logcat.txt || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: kadraj-screenshots
          path: |
            home.png
            editor.png
            style.png
            photo.png
            text.png
            activity.txt
            logcat.txt
          if-no-files-found: error
